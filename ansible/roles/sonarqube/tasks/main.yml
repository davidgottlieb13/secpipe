---
# SonarQube requires Elasticsearch-compatible kernel limits. Without this,
# the container starts and then crash-loops with a cryptic "max virtual
# memory areas vm.max_map_count is too low" error.
- name: Set vm.max_map_count for Elasticsearch (SonarQube dependency)
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

- name: Set fs.file-max
  sysctl:
    name: fs.file-max
    value: '65536'
    state: present
    reload: yes

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: Add ansible user to docker group
  user:
    name: ansible
    groups: docker
    append: yes

- name: Create SonarQube data directories
  file:
    path: "/opt/sonarqube/{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - data
    - logs
    - extensions

- name: Run SonarQube container
  docker_container:
    name: sonarqube
    image: sonarqube:10.6-community
    state: started
    restart_policy: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /opt/sonarqube/data:/opt/sonarqube/data
      - /opt/sonarqube/logs:/opt/sonarqube/logs
      - /opt/sonarqube/extensions:/opt/sonarqube/extensions
    env:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
